<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
   <main class="main">
        <aside class="left-div">
            <img src="assets/img/logo.png" class="logo" alt="Buddy anime girl and robot logo">
            <p class="brand-caption">Your AI BSET FRIEND</p>
            <div class="sidebar-note">
                A little space to talk, share, and be yourself.
            </div>
        </aside>

        <section class="right-div">
            <header class="heading-container">
                <h1 class="heading">Hey there! Welcome to Buddy <span>♡</span></h1>
                <p class="h-p">What's on your mind today?</p>
            </header>

            <section class="chat-Container" aria-label="Chat with Buddy">
                <div class="chat-box" id="chat-box" aria-live="polite">
                    <div class="message user-message">HI</div>
                    <div class="message bot-message">Hey! It's nice to see you. How's your day going? 💜</div>
                </div>
                <div class="input-area">
                    <input type="text" placeholder="Share what's on your mind..." id="user-input" class="user-input">
                    <button onclick="sendMessage()" class="send-btn">Send <span aria-hidden="true">➜</span></button>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
